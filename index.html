<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>un-mutual X</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --accent: #1d9bf0;
      --border: #2f3b47;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
    }

    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .field + .field {
      margin-top: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
    }

    button {
      margin-top: 16px;
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 10px;
      color: #f4212e;
      font-size: 0.9rem;
    }

    #result {
      display: none;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 1.3rem;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }

    li:last-child {
      border-bottom: 0;
    }

    li.done {
      opacity: 0.4;
    }

    li.done .id {
      text-decoration: line-through;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .id {
      color: var(--muted);
      font-size: 0.85rem;
      word-break: break-all;
    }

    li a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    li a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>un-mutual X</h1>
    <p class="sub">cek siapa yang kamu follow tapi nggak follow kamu balik.</p>

    <div class="card">
      <div class="field">
        <label for="followingFile">1. File following.js</label>
        <input type="file" id="followingFile" accept=".js,.json,.txt">
      </div>

      <div class="field">
        <label for="followerFile">2. File follower.js</label>
        <input type="file" id="followerFile" accept=".js,.json,.txt">
      </div>

      <button id="runBtn" disabled>Cek sekarang</button>
      <div class="error" id="error"></div>
    </div>

    <div class="card" id="result">
      <div class="stats">
        <div class="stat"><b id="nFollowing">0</b><span>Following</span></div>
        <div class="stat"><b id="nFollowers">0</b><span>Followers</span></div>
        <div class="stat"><b id="nNon">0</b><span>Nggak follback</span></div>
      </div>
      <ul id="list"></ul>
    </div>
  </div>

  <script>
    const followingInput = document.getElementById('followingFile');
    const followerInput = document.getElementById('followerFile');
    const runBtn = document.getElementById('runBtn');
    const errorBox = document.getElementById('error');
    const resultBox = document.getElementById('result');
    const listEl = document.getElementById('list');

    function updateButton() {
      runBtn.disabled = !(followingInput.files[0] && followerInput.files[0]);
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    function readFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Gagal membaca file.'));
        reader.readAsText(file);
      });
    }

    function parseArchive(text) {
      const start = text.indexOf('[');
      if (start === -1) {
        throw new Error('Format file tidak dikenali.');
      }
      return JSON.parse(text.slice(start));
    }

    function extractIds(items, key) {
      return items
        .map((item) => item[key] && item[key].accountId)
        .filter(Boolean);
    }

    function renderList(ids) {
      listEl.innerHTML = '';

      ids.forEach((id) => {
  const li = document.createElement('li');
  li.innerHTML = `
    <div class="row">
      <input type="checkbox" aria-label="Sudah unfollow">
      <span class="id">ID: ${id}</span>
    </div>
    <a href="https://twitter.com/intent/user?user_id=${id}" target="_blank" rel="noopener">Buka profil</a>`;

  li.querySelector('input').addEventListener('change', (event) => {
    li.classList.toggle('done', event.target.checked);
  });

  listEl.appendChild(li);
});
    }

    async function handleCheck() {
      errorBox.style.display = 'none';

      try {
        const [followingText, followerText] = await Promise.all([
          readFile(followingInput.files[0]),
          readFile(followerInput.files[0]),
        ]);

        const following = extractIds(parseArchive(followingText), 'following');
        const followers = new Set(extractIds(parseArchive(followerText), 'follower'));

        if (following.length === 0) {
          throw new Error('Data following kosong. Pastikan file following.js yang dipilih.');
        }

        const nonFollowback = following.filter((id) => !followers.has(id));

        document.getElementById('nFollowing').textContent = following.length;
        document.getElementById('nFollowers').textContent = followers.size;
        document.getElementById('nNon').textContent = nonFollowback.length;

        renderList(nonFollowback);
        resultBox.style.display = 'block';
      } catch (err) {
        resultBox.style.display = 'none';
        showError(`Gagal memproses: ${err.message} Cek lagi apakah kamu memilih file yang benar (following.js dan follower.js).`);
      }
    }

    followingInput.addEventListener('change', updateButton);
    followerInput.addEventListener('change', updateButton);
    runBtn.addEventListener('click', handleCheck);
  </script>
</body>
</html>
